<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXRCY Chatbot</title>
    <style>
        :root {
            --bg: #0f172a;
            --primary: #8b5cf6;
            --accent: #ec4899;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* The Chat Container */
        #chat-container {
            width: 400px;
            height: 600px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Animated Header */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: float 3s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: white;
            box-shadow: 0 0 20px var(--primary);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Chat Window */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .bot-msg {
            background: var(--primary);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-msg {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            color: white;
            outline: none;
        }

        button {
            background: var(--primary);
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        /* Custom Scrollbar */
        #chat-window::-webkit-scrollbar { width: 5px; }
        #chat-window::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <header>
        <div class="avatar">M</div>
        <h2 style="color: var(--text); margin: 0; font-size: 18px;">MXRCY</h2>
        <small style="color: #94a3b8;">Always Active</small>
    </header>

    <div id="chat-window">
        <div class="message bot-msg">Hey! I'm MXRCY. Ready to create something cool today?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Say something..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');

    // Basic logic for MXRCY's personality
    const responses = {
        "hello": "Hi there! I'm feeling extra digital today. How about you?",
        "who are you": "I'm MXRCY, your creative AI companion built with pure style.",
        "help": "I can chat, keep you company, or just look cool on your screen!",
        "bye": "Going so soon? Fine, I'll just stay here and look pretty. Bye!",
        "default": "That's interesting! Tell me more about that."
    };

    function sendMessage() {
        const text = userInput.value.trim().toLowerCase();
        if (text === "") return;

        // User Message
        appendMessage(userInput.value, 'user-msg');
        userInput.value = "";

        // Bot Response Delay (to feel more "human")
        setTimeout(() => {
            const reply = responses[text] || responses["default"];
            appendMessage(reply, 'bot-msg');
        }, 600);
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
